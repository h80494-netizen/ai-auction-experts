version: '3.8'

services:
  ai-auction:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-auction-app
    restart: always
    ports:
      - "80:8001"
      - "8001:8001"
    volumes:
      - ./backend/data:/app/backend/data
      - ./cache:/app/cache
      - ./public/data:/app/public/data
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8001
    env_file:
      - ./backend/.env
